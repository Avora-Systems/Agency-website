<text x="512" y="409" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="end" font-family="sans-serif">£355.00</text>
<circle cx="524" cy="380" r="34" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<path d="M508 380L519 391L541 367" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
