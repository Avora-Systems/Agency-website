<text x="152" y="176" font-size="10" font-weight="600" fill="#8B95A7" font-family="sans-serif">BILLED TO</text>
<rect x="152" y="186" width="90" height="12" rx="3" fill="#52607A"/>
<rect x="380" y="215" width="148" height="46" rx="8" fill="#EEF2F7"/>
<rect x="398" y="228" width="112" height="9" rx="3" fill="#52607A"/>
<rect x="152" y="230" width="200" height="9" rx="3" fill="#52607A" opacity="0.7"/>
<rect x="152" y="252" width="170" height="9" rx="3" fill="#52607A" opacity="0.7"/>
<line x1="152" y1="290" x2="528" y2="290" stroke="#E2E8F0" stroke-width="1"/>
<rect x="152" y="308" width="130" height="10" rx="3" fill="#52607A" opacity="0.6"/>
<rect x="470" y="308" width="58" height="10" rx="3" fill="#52607A" opacity="0.6"/>
<rect x="152" y="332" width="150" height="10" rx="3" fill="#52607A" opacity="0.6"/>
<rect x="470" y="332" width="58" height="10" rx="3" fill="#52607A" opacity="0.6"/>
