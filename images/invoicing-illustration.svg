<text x="152" y="128" font-size="11" fill="#8B95A7" font-family="sans-serif">tom@avora-systems.com</text>
<text x="528" y="104" font-size="18" font-weight="600" fill="#0F172A" text-anchor="end" font-family="sans-serif">INVOICE</text>
