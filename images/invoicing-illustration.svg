<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Illustration of an automated invoice document</title>
<desc>A clean invoice document on a light background, showing a header, billed-to section, line items, a highlighted total, and a paid checkmark badge, in the site's blue accent colour.</desc>
<defs>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#2563EB" stop-opacity="0.10"/>
<stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="680" height="520" fill="#F7F9FC"/>
<circle cx="560" cy="80" r="140" fill="url(#glow)"/>
<circle cx="90" cy="440" r="120" fill="url(#glow)"/>
<rect x="120" y="60" width="440" height="400" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
